name: Release

# Push a tag like v0.16.0 (matching anim2d.__version__) to build and publish a Windows release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    permissions:
      contents: write  # create the release and upload its files
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev,build]"
      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $version = python -c "import anim2d; print(anim2d.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Host "::error::Tag ${{ github.ref_name }} does not match anim2d.__version__ ($version)"
            exit 1
          }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Test
        run: |
          python tools/fetch_spine_runtime.py
          python -m pytest -ra
      - name: Build program and installer
        run: python tools/build_exe.py
      - name: Self-test the built program
        shell: pwsh
        run: ./tools/self_test.ps1 -Program dist/Anim2D.exe -Output selftest
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/Anim2D-Setup-$env:VERSION.exe" dist/Anim2D.exe dist/SHA256SUMS.txt `
            --title "Anim2D $env:VERSION" --generate-notes --verify-tag
