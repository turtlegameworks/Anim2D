name: Release

# Push a tag like v0.18.0 (matching anim2d.__version__, with a "## 0.18.0" entry in CHANGELOG.md) to build,
# test and publish a release: the Windows installer and portable program, and a macOS disk image each for
# Apple silicon and Intel Macs. The release's description is the CHANGELOG.md entry and a downloads table.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  check:
    name: Check version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check the tag matches the version
        id: version
        run: |
          version=$(PYTHONPATH=src python -c "import anim2d; print(anim2d.__version__)")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match anim2d.__version__ ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check CHANGELOG.md has this version's entry
        run: python tools/release_notes.py "${{ steps.version.outputs.version }}" > /dev/null

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev,build]"
      - name: Test
        run: |
          python tools/fetch_spine_runtime.py
          python -m pytest -ra
      - name: Build program and installer
        run: python tools/build_exe.py
      - name: Self-test the built program
        shell: pwsh
        run: ./tools/self_test.ps1 -Program dist/Anim2D.exe -Output selftest
      # Published next to the installer, so the two are easy to tell apart in the release's assets.
      - name: Name the portable program
        shell: pwsh
        run: Move-Item dist/Anim2D.exe "dist/Anim2D-Portable-$env:VERSION.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            dist/Anim2D-Setup-${{ env.VERSION }}.exe
            dist/Anim2D-Portable-${{ env.VERSION }}.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS (${{ matrix.label }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: macos-14, arch: AppleSilicon, label: "Apple silicon"}
          - {os: macos-15-intel, arch: Intel, label: "Intel"}
    env:
      DMG: dist/Anim2D-${{ needs.check.outputs.version }}-macOS-${{ matrix.arch }}.dmg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev,build]"
      - name: Test
        run: |
          python tools/fetch_spine_runtime.py
          python -m pytest -ra
      - name: Build the app and its disk image
        run: python tools/build_mac.py
      - name: Self-test the disk image
        run: python tools/self_test.py "$DMG" --arch ${{ matrix.arch }} --output selftest
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: ${{ env.DMG }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [check, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its files
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum Anim2D-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 4  # installer, portable, two disk images
      - name: Release notes
        run: python tools/release_notes.py "$VERSION" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/Anim2D-* dist/SHA256SUMS.txt \
            --title "Anim2D $VERSION" --notes-file notes.md --verify-tag
