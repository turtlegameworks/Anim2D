name: Release

# Builds, tests and publishes a release: the Windows installer and portable program, and a macOS disk image
# each for Apple silicon and Intel Macs. The release's description is the version's CHANGELOG.md entry and a
# downloads table. Two ways to start it, for the version in anim2d.__version__ (with a "## 0.18.0" entry in
# CHANGELOG.md):
#   - push a tag like v0.18.0, or
#   - Actions → Release → Run workflow on main: the release, and its tag, are made on the commit it built.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  check:
    name: Check version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check the tag matches the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(PYTHONPATH=src python -c "import anim2d; print(anim2d.__version__)")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Run workflow: release main's version, under a tag that doesn't exist yet.
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run the release on main (it was run on $GITHUB_REF_NAME)"
              exit 1
            fi
            # Only a 404 means the tag is free; any other failure (rate limit, outage) stops here.
            if found=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" 2>&1); then
              echo "::error::v$version is already released: raise anim2d.__version__ first"
              exit 1
            elif ! grep -q "HTTP 404" <<< "$found"; then
              echo "::error::Couldn't check whether v$version exists: $found"
              exit 1
            fi
          elif [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match anim2d.__version__ ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check CHANGELOG.md has this version's entry
        run: python tools/release_notes.py "${{ steps.version.outputs.version }}" > /dev/null

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev,build]"
      - name: Test
        run: |
          python tools/fetch_spine_runtime.py
          python -m pytest -ra
      - name: Build program and installer
        run: python tools/build_exe.py
      - name: Self-test the built program
        shell: pwsh
        run: ./tools/self_test.ps1 -Program dist/Anim2D.exe -Output selftest
      # Published next to the installer, so the two are easy to tell apart in the release's assets.
      - name: Name the portable program
        shell: pwsh
        run: Move-Item dist/Anim2D.exe "dist/Anim2D-Portable-$env:VERSION.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            dist/Anim2D-Setup-${{ env.VERSION }}.exe
            dist/Anim2D-Portable-${{ env.VERSION }}.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS (${{ matrix.label }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: macos-15, arch: AppleSilicon, label: "Apple silicon"}
          - {os: macos-15-intel, arch: Intel, label: "Intel"}
    env:
      DMG: dist/Anim2D-${{ needs.check.outputs.version }}-macOS-${{ matrix.arch }}.dmg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev,build]"
      - name: Test
        run: |
          python tools/fetch_spine_runtime.py
          python -m pytest -ra
      - name: Build the app and its disk image
        run: python tools/build_mac.py
      - name: Self-test the disk image
        run: python tools/self_test.py "$DMG" --arch ${{ matrix.arch }} --output selftest
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: ${{ env.DMG }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [check, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its files
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum Anim2D-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 4  # installer, portable, two disk images
      - name: Release notes
        run: python tools/release_notes.py "$VERSION" > notes.md
      # Run workflow: create v<version> on the commit every job built. Creating the ref fails if the tag
      # exists, so a tag pushed meanwhile can't end up with these files. (A tag made with this token
      # doesn't start another release run.) A pushed tag is used as it is.
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/Anim2D-* dist/SHA256SUMS.txt \
            --title "Anim2D $VERSION" --notes-file notes.md --verify-tag
